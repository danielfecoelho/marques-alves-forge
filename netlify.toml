[build]
  command = "bun run build"
  publish = "dist"

# O servidor (SSR) e o endpoint /api/public/contact são gerados automaticamente
# pelo preset "netlify" do Nitro (configurado em vite.config.ts) como uma
# Netlify Serverless Function em .netlify/functions-internal/server.
# Essa função regista-se como catch-all (path: "/*", preferStatic: true), pelo
# que os ficheiros estáticos em "dist" (assets/img) são servidos diretamente e
# todo o resto (páginas SSR + /api/public/contact) passa pela função.
# Por isso NÃO se define "functions" manualmente — o Nitro trata disso.
