name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Locate folder and prepare 404
        run: |
          if [ -d "dist" ]; then
            echo "DIRECTORY_PATH=dist" >> $GITHUB_ENV
            cp dist/index.html dist/404.html
          elif [ -d "build" ]; then
            echo "DIRECTORY_PATH=build" >> $GITHUB_ENV
            cp build/index.html build/404.html
          elif [ -d ".output/public" ]; then
            echo "DIRECTORY_PATH=.output/public" >> $GITHUB_ENV
            cp .output/public/index.html .output/public/404.html
          else
            # Caso crie noutra pasta, procura o index.html gerado
            TARGET_DIR=$(dirname $(find . -name "index.html" -not -path "./node_modules/*" -not -path "./src/*" | head -n 1))
            echo "DIRECTORY_PATH=$TARGET_DIR" >> $GITHUB_ENV
            cp "$TARGET_DIR/index.html" "$TARGET_DIR/404.html"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIRECTORY_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
