name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Find build folder
        run: |
          if [ -d "dist" ]; then
            echo "DIRECTORY_PATH=dist" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            echo "DIRECTORY_PATH=build" >> $GITHUB_ENV
          elif [ -d ".output/public" ]; then
            echo "DIRECTORY_PATH=.output/public" >> $GITHUB_ENV
          else
            echo "DIRECTORY_PATH=." >> $GITHUB_ENV
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIRECTORY_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
